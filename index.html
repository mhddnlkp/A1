<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>A1 Staff</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      max-width: 520px;
      margin: 0 auto;
      padding: 18px;
      background: #f7f7f7;
      color: #222;
    }

    h1,
    h2,
    h3 {
      margin-top: 0;
    }

    h1 {
      text-align: center;
      font-size: 25px;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 2px 10px rgba(0,0,0,.06);
    }

    .hidden {
      display: none !important;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 10px;
      font-size: 16px;
      font-weight: bold;
      border: 0;
      border-radius: 9px;
      cursor: pointer;
    }

    .primary {
      background: #222;
      color: #fff;
    }

    .green {
      background: #17743b;
      color: #fff;
    }

    .light {
      background: #e9e9e9;
      color: #222;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      margin-top: 7px;
      margin-bottom: 8px;
    }

    label {
      font-weight: bold;
      font-size: 14px;
    }

    #reader {
      width: 100%;
      margin-top: 14px;
    }

    #message {
      min-height: 22px;
      margin-bottom: 12px;
      font-weight: bold;
    }

    .menu button {
      margin-top: 12px;
      min-height: 58px;
    }

    .product {
      text-align: center;
    }

    .product img {
      width: 150px;
      height: 150px;
      object-fit: cover;
      background: #eee;
      border-radius: 10px;
      margin-bottom: 10px;
    }

    .price {
      font-size: 28px;
      font-weight: bold;
      margin: 10px 0;
    }

    .meta {
      line-height: 1.7;
      text-align: left;
    }

    .cart-option {
      width: 100%;
      text-align: left;
      background: #fff;
      border: 1px solid #ddd;
      padding: 13px;
      border-radius: 9px;
      margin-top: 9px;
    }

    .cart-option strong {
      display: block;
      font-size: 16px;
    }

    .small {
      font-size: 12px;
      color: #666;
      margin-top: 4px;
    }

    .cart-item {
      border-bottom: 1px solid #eee;
      padding: 10px 0;
      display: grid;
      grid-template-columns: 64px 1fr;
      gap: 10px;
      align-items: center;
    }

    .cart-item img {
      width: 64px;
      height: 64px;
      object-fit: cover;
      border-radius: 8px;
      background: #eee;
    }

    .cart-item-image-placeholder {
      width: 64px;
      height: 64px;
      border-radius: 8px;
      background: #eee;
    }

    .subtotal {
      font-size: 22px;
      font-weight: bold;
      margin-top: 14px;
      text-align: right;
    }

    .top-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
  </style>
</head>

<body>

<h1>A1 Staff</h1>

<div id="message"></div>


<section id="loginScreen" class="card">

  <h2>Staff Login</h2>

  <label>Staff Name / ID</label>

  <input
    id="staffId"
    placeholder="Example: STAFF 01">

  <button
    class="primary"
    onclick="loginStaff()">
    LOGIN
  </button>

</section>


<section id="homeScreen" class="card hidden">

  <h2 id="welcomeText">
    Staff Home
  </h2>

  <div class="menu">

    <button
      class="primary"
      onclick="openPriceScanner()">
      PRICE SCANNER
    </button>

    <button
      class="green"
      onclick="showCreateCart()">
      OPEN NEW CART
    </button>

    <button
      class="light"
      onclick="showJoinCart()">
      JOIN EXISTING CART
    </button>

  </div>

</section>


<section id="createCartScreen" class="card hidden">

  <h2>Open New Cart</h2>

  <label>Customer Name</label>

  <input
    id="customerName"
    placeholder="Customer name">

  <label>Mobile Number</label>

  <input
    id="mobileNumber"
    placeholder="Optional">

  <button
    class="green"
    onclick="createCart()">
    CREATE & OPEN CART
  </button>

  <button
    class="light"
    onclick="goHome()">
    BACK
  </button>

</section>


<section id="joinCartScreen" class="card hidden">

  <h2>Active Carts</h2>

  <div id="activeCarts">
    Loading...
  </div>

  <button
    class="light"
    onclick="goHome()">
    BACK
  </button>

</section>


<section id="scannerScreen" class="card hidden">

  <h2 id="scannerTitle">
    Scanner
  </h2>

  <div
    id="scannerContext"
    class="small">
  </div>

  <button
    id="startScannerButton"
    class="primary"
    onclick="startScanner()">
    START SCANNER
  </button>

  <div id="reader"></div>

  <button
    class="light"
    onclick="exitScanner()">
    BACK
  </button>

</section>


<section id="productScreen" class="card hidden">

  <div id="productResult"></div>

</section>


<section id="cartSelectScreen" class="card hidden">

  <h2>Add to Which Cart?</h2>

  <div id="cartChoices">
    Loading...
  </div>

  <button
    class="green"
    onclick="createCartForScannedProduct()">
    CREATE NEW CART
  </button>

  <button
    class="light"
    onclick="cancelCartSelection()">
    CANCEL
  </button>

</section>


<section id="cartScreen" class="card hidden">

  <h2 id="cartHeading">
    Customer Cart
  </h2>

  <div
    id="cartInfo"
    class="small">
  </div>

  <div class="top-actions">

    <button
      class="primary"
      onclick="openInsideCartScanner()">
      SCAN PRODUCT
    </button>

    <button
      class="light"
      onclick="goHome()">
      HOME
    </button>

  </div>

  <div id="cartItems"></div>

  <div
    id="cartSubtotal"
    class="subtotal">
  </div>

</section>


<script>

const backendUrl =
  "https://script.google.com/macros/s/AKfycbyagVLGrAMPyT9gZGptDhbM4WrzeW48WBTaM_SLe0e7o4d1QGUMW4XePuknS4DqbmFm/exec";

let loggedStaff = "";
let scanner = null;
let scannerMode = "PRICE";
let currentCartId = "";
let scannedProduct = null;
let returnScreen = "homeScreen";
let createCartFromScannedProduct = false;


function showOnly(id) {

  [
    "loginScreen",
    "homeScreen",
    "createCartScreen",
    "joinCartScreen",
    "scannerScreen",
    "productScreen",
    "cartSelectScreen",
    "cartScreen"
  ].forEach(
    function(screenId) {
      document
        .getElementById(screenId)
        .classList
        .add("hidden");
    }
  );

  document
    .getElementById(id)
    .classList
    .remove("hidden");

}


function message(text, isError) {

  const box =
    document.getElementById(
      "message"
    );

  box.textContent =
    text || "";

  box.style.color =
    isError
      ? "red"
      : "#17743b";

}


async function api(params) {

  const query =
    new URLSearchParams(
      params
    );

  query.set(
    "_",
    Date.now()
  );

  const response =
    await fetch(
      backendUrl +
      "?" +
      query.toString(),
      {
        method: "GET",
        cache: "no-store"
      }
    );

  if (!response.ok) {

    throw new Error(
      "Backend error: " +
      response.status
    );

  }

  return await response.json();

}


function loginStaff() {

  const id =
    document
      .getElementById(
        "staffId"
      )
      .value
      .trim();

  if (!id) {

    message(
      "Enter Staff Name / ID.",
      true
    );

    return;

  }

  loggedStaff =
    id;

  document
    .getElementById(
      "welcomeText"
    )
    .textContent =
      "Welcome, " +
      loggedStaff;

  message("");

  openPriceScanner();

}


async function goHome() {

  await stopScannerQuietly();

  currentCartId =
    "";

  scannedProduct =
    null;

  message("");

  showOnly(
    "homeScreen"
  );

}


function showCreateCart() {

  createCartFromScannedProduct =
    false;

  showOnly(
    "createCartScreen"
  );

}


async function createCart() {

  const customerName =
    document
      .getElementById(
        "customerName"
      )
      .value
      .trim();

  const mobileNumber =
    document
      .getElementById(
        "mobileNumber"
      )
      .value
      .trim();

  if (!customerName) {

    message(
      "Customer Name is required.",
      true
    );

    return;

  }

  message(
    "Creating cart..."
  );

  try {

    const data =
      await api({
        action:
          "retailCreateCart",
        customerName:
          customerName,
        mobileNumber:
          mobileNumber,
        staff:
          loggedStaff
      });

    if (!data.success) {

      throw new Error(
        data.message ||
        "Could not create cart."
      );

    }

    document
      .getElementById(
        "customerName"
      )
      .value =
        "";

    document
      .getElementById(
        "mobileNumber"
      )
      .value =
        "";

    currentCartId =
      data.cartId;

    if (
      createCartFromScannedProduct &&
      scannedProduct
    ) {

      createCartFromScannedProduct =
        false;

      scannerMode =
        "CART";

      await addProductToCart(
        currentCartId
      );

      return;

    }

    await openCart(
      currentCartId
    );

    message(
      "Cart created."
    );

  } catch (error) {

    message(
      error.message,
      true
    );

  }

}


async function showJoinCart() {

  showOnly(
    "joinCartScreen"
  );

  document
    .getElementById(
      "activeCarts"
    )
    .innerHTML =
      "Loading active carts...";

  try {

    const data =
      await api({
        action:
          "retailActiveCarts"
      });

    if (!data.success) {

      throw new Error(
        data.message ||
        "Could not load carts."
      );

    }

    renderActiveCarts(
      data.carts || [],
      "activeCarts",
      openCart
    );

  } catch (error) {

    document
      .getElementById(
        "activeCarts"
      )
      .textContent =
        error.message;

  }

}


function renderActiveCarts(
  carts,
  targetId,
  clickHandler
) {

  const box =
    document.getElementById(
      targetId
    );

  box.innerHTML =
    "";

  if (!carts.length) {

    box.innerHTML =
      "<p>No active carts.</p>";

    return;

  }

  carts.forEach(
    function(cart) {

      const button =
        document.createElement(
          "button"
        );

      button.className =
        "cart-option";

      button.innerHTML =

        "<strong>" +
        esc(
          cart.customerName ||
          "Walk-in Customer"
        ) +
        "</strong>" +

        "<div class='small'>" +

        esc(
          cart.cartId
        ) +

        " · Created By: " +

        esc(
          cart.createdBy
        ) +

        " · ₹" +

        Number(
          cart.subtotal || 0
        ) +

        "</div>";

      button.onclick =
        function() {

          clickHandler(
            cart.cartId
          );

        };

      box.appendChild(
        button
      );

    }
  );

}


async function openCart(
  cartId
) {

  message(
    "Opening cart..."
  );

  try {

    const data =
      await api({
        action:
          "retailCart",
        cartId:
          cartId
      });

    if (!data.success) {

      throw new Error(
        data.message ||
        "Could not open cart."
      );

    }

    currentCartId =
      data.cart.cartId;

    showOnly(
      "cartScreen"
    );

    document
      .getElementById(
        "cartHeading"
      )
      .textContent =
        data.cart.customerName ||
        "Customer Cart";

    document
      .getElementById(
        "cartInfo"
      )
      .textContent =
        "Cart: " +
        data.cart.cartId +
        " | Created By: " +
        data.cart.createdBy;

    renderCartItems(
      data
    );

    message("");

  } catch (error) {

    message(
      error.message,
      true
    );

  }

}


function renderCartItems(
  data
) {

  const box =
    document.getElementById(
      "cartItems"
    );

  box.innerHTML =
    "";

  const items =
    data.items || [];

  if (!items.length) {

    box.innerHTML =
      "<p>No products added yet.</p>";

  } else {

    items.forEach(
      function(item) {

        const div =
          document.createElement(
            "div"
          );

        div.className =
          "cart-item";

        const imageId =
          "cart-img-" +
          Math.random()
            .toString(36)
            .slice(2);

        div.innerHTML =

          "<div id='" +
          imageId +
          "' class='cart-item-image-placeholder'></div>" +

          "<div>" +

          "<strong>" +
          esc(
            item.productName
          ) +
          "</strong>" +

          "<div class='small'>" +

          esc(
            item.sku
          ) +

          " · Qty: " +
          Number(
            item.quantity
          ) +

          " · Added By: " +

          esc(
            item.addedBy
          ) +

          "</div>" +

          "<div>₹" +
          Number(
            item.lineTotal || 0
          ) +
          "</div>" +

          "</div>";

        box.appendChild(
          div
        );

        loadCartItemImage(
          item.sku,
          imageId
        );

      }
    );

  }

  document
    .getElementById(
      "cartSubtotal"
    )
    .textContent =
      "Subtotal: ₹" +
      Number(
        data.cart.subtotal || 0
      );

}



async function loadCartItemImage(
  sku,
  targetId
) {

  try {

    const data =
      await api({
        action:
          "retailProductImage",
        identifier:
          sku
      });

    if (
      !data.success ||
      !data.imageData
    ) {
      return;
    }

    const target =
      document.getElementById(
        targetId
      );

    if (!target) {
      return;
    }

    target.outerHTML =
      "<img src='" +
      data.imageData +
      "' alt='Product Image'>";

  } catch (_) {
    // Keep placeholder if image cannot be loaded.
  }

}


function openPriceScanner() {

  scannerMode =
    "PRICE";

  currentCartId =
    "";

  returnScreen =
    "homeScreen";

  document
    .getElementById(
      "scannerTitle"
    )
    .textContent =
      "Price Scanner";

  document
    .getElementById(
      "scannerContext"
    )
    .textContent =
      "Scan to check price. Nothing is added automatically.";

  showOnly(
    "scannerScreen"
  );

  setTimeout(
    function() {
      startScanner();
    },
    120
  );

}


function openInsideCartScanner() {

  if (!currentCartId) {

    message(
      "No cart is open.",
      true
    );

    return;

  }

  scannerMode =
    "CART";

  returnScreen =
    "cartScreen";

  document
    .getElementById(
      "scannerTitle"
    )
    .textContent =
      "Cart Scanner";

  document
    .getElementById(
      "scannerContext"
    )
    .textContent =
      "Scan to check price, then choose ADD TO CART or CANCEL.";

  showOnly(
    "scannerScreen"
  );

  setTimeout(
    function() {
      startScanner();
    },
    120
  );

}


async function startScanner() {

  message(
    "Opening camera..."
  );

  document
    .getElementById(
      "startScannerButton"
    )
    .disabled =
      true;

  try {

    if (scanner) {

      try {
        await scanner.clear();
      } catch (_) {}

    }

    scanner =
      new Html5Qrcode(
        "reader"
      );

    const cameras =
      await Html5Qrcode
        .getCameras();

    if (
      !cameras ||
      !cameras.length
    ) {

      throw new Error(
        "No camera found."
      );

    }

    const cameraId =
      cameras[
        cameras.length - 1
      ].id;

    await scanner.start(

      cameraId,

      {
        fps:
          10,

        qrbox: {
          width:
            280,
          height:
            120
        }
      },

      onScanSuccess

    );

    message("");

  } catch (error) {

    document
      .getElementById(
        "startScannerButton"
      )
      .disabled =
        false;

    message(
      "Camera error: " +
      error.message,
      true
    );

  }

}


async function onScanSuccess(
  decodedText
) {

  await stopScannerQuietly();

  message(
    "Looking up product..."
  );

  try {

    const data =
      await api({
        action:
          "retailProduct",
        identifier:
          decodedText
      });

    if (
      !data.success ||
      !data.found
    ) {

      throw new Error(
        data.message ||
        "Product not found."
      );

    }

    scannedProduct =
      data.product;

    showProduct(
      scannedProduct
    );

    message("");

  } catch (error) {

    message(
      error.message,
      true
    );

    showOnly(
      "scannerScreen"
    );

  }

}


function showProduct(
  product
) {

  showOnly(
    "productScreen"
  );

  let image =
    "";

  if (product.imageData) {

    image =
      "<img src='" +
      product.imageData +
      "' alt='Product Image'>";

  }

  document
    .getElementById(
      "productResult"
    )
    .innerHTML =

      "<div class='product'>" +

      image +

      "<h2>" +
      esc(
        product.productName ||
        product.category ||
        "Product"
      ) +
      "</h2>" +

      "<div class='price'>₹" +
      Number(
        product.rp || 0
      ) +
      "</div>" +

      "<div class='meta'>" +

      "<p><strong>SKU:</strong> " +
      esc(
        product.sku
      ) +
      "</p>" +

      "<p><strong>Stock:</strong> " +
      Number(
        product.currentStock || 0
      ) +
      "</p>" +

      "</div>" +

      "<button class='green' onclick='productAddDecision()'>" +
      "ADD TO CART" +
      "</button>" +

      "<button class='light' onclick='cancelScannedProduct()'>" +
      "CANCEL" +
      "</button>" +

      "</div>";

}


async function productAddDecision() {

  if (!scannedProduct) {
    return;
  }

  if (
    scannerMode ===
    "CART"
  ) {

    await addProductToCart(
      currentCartId
    );

    return;

  }

  showOnly(
    "cartSelectScreen"
  );

  document
    .getElementById(
      "cartChoices"
    )
    .innerHTML =
      "Loading active carts...";

  try {

    const data =
      await api({
        action:
          "retailActiveCarts"
      });

    if (!data.success) {

      throw new Error(
        data.message ||
        "Could not load carts."
      );

    }

    const carts =
      data.carts || [];

    const box =
      document.getElementById(
        "cartChoices"
      );

    box.innerHTML =
      "";

    if (!carts.length) {

      box.innerHTML =
        "<p>No active carts. Create a new cart for this customer.</p>";

    } else {

      renderActiveCarts(
        carts,
        "cartChoices",
        addProductToCart
      );

    }

  } catch (error) {

    document
      .getElementById(
        "cartChoices"
      )
      .textContent =
        error.message;

  }

}


function createCartForScannedProduct() {

  if (!scannedProduct) {

    message(
      "No scanned product is waiting.",
      true
    );

    return;
  }

  createCartFromScannedProduct =
    true;

  showOnly(
    "createCartScreen"
  );

  document
    .getElementById(
      "customerName"
    )
    .focus();

}


async function addProductToCart(
  cartId
) {

  if (!scannedProduct) {
    return;
  }

  const productToAdd =
    scannedProduct;

  const addedName =
    productToAdd.productName ||
    productToAdd.sku;

  currentCartId =
    cartId;

  scannedProduct =
    null;

  if (
    scannerMode ===
    "CART"
  ) {

    showOptimisticCartAdd(
      productToAdd
    );

  } else {

    showOnly(
      "scannerScreen"
    );

    message(
      addedName +
      " is being added..."
    );

  }

  try {

    const data =
      await api({
        action:
          "retailAddItem",
        cartId:
          cartId,
        identifier:
          productToAdd.sku,
        quantity:
          1,
        staff:
          loggedStaff
      });

    if (!data.success) {

      throw new Error(
        data.message ||
        "Could not add product."
      );

    }

    message(
      addedName +
      " added to cart."
    );

    if (
      scannerMode ===
      "CART"
    ) {

      renderCartItems(
        data
      );

    } else {

      openPriceScanner();

    }

  } catch (error) {

    message(
      error.message,
      true
    );

    if (
      scannerMode ===
      "CART"
    ) {

      await openCart(
        cartId
      );

    }

  }

}


function showOptimisticCartAdd(
  product
) {

  showOnly(
    "cartScreen"
  );

  const box =
    document.getElementById(
      "cartItems"
    );

  if (!box) {
    return;
  }

  if (
    box.textContent
      .trim() ===
      "No products added yet."
  ) {

    box.innerHTML =
      "";

  }

  const div =
    document.createElement(
      "div"
    );

  div.className =
    "cart-item";

  div.style.opacity =
    "0.7";

  const imageHtml =
    product.imageData
      ? "<img src='" +
        product.imageData +
        "' alt='Product Image'>"
      : "<div class='cart-item-image-placeholder'></div>";

  div.innerHTML =

    imageHtml +

    "<div>" +

    "<strong>" +
    esc(
      product.productName ||
      product.sku
    ) +
    "</strong>" +

    "<div class='small'>" +

    esc(
      product.sku
    ) +

    " · Qty: 1" +

    " · Added By: " +

    esc(
      loggedStaff
    ) +

    "</div>" +

    "<div>₹" +
    Number(
      product.rp || 0
    ) +
    "</div>" +

    "<div class='small'>Saving...</div>" +

    "</div>";

  box.appendChild(
    div
  );

  const currentSubtotalText =
    document
      .getElementById(
        "cartSubtotal"
      )
      .textContent || "";

  const match =
    currentSubtotalText
      .match(/([\d.]+)$/);

  const currentSubtotal =
    match
      ? Number(
          match[1]
        )
      : 0;

  document
    .getElementById(
      "cartSubtotal"
    )
    .textContent =
      "Subtotal: ₹" +
      (
        currentSubtotal +
        Number(
          product.rp || 0
        )
      );

}


function cancelScannedProduct() {

  scannedProduct =
    null;

  if (
    scannerMode ===
    "CART"
  ) {

    openCart(
      currentCartId
    );

  } else {

    openPriceScanner();

  }

}


function cancelCartSelection() {

  createCartFromScannedProduct =
    false;

  if (scannedProduct) {

    showProduct(
      scannedProduct
    );

  } else {

    showOnly(
      "homeScreen"
    );

  }

}


async function exitScanner() {

  await stopScannerQuietly();

  if (
    returnScreen ===
      "cartScreen" &&
    currentCartId
  ) {

    openCart(
      currentCartId
    );

  } else {

    showOnly(
      "homeScreen"
    );

  }

}


async function stopScannerQuietly() {

  if (!scanner) {

    document
      .getElementById(
        "startScannerButton"
      )
      .disabled =
        false;

    return;

  }

  try {

    if (
      scanner.isScanning
    ) {

      await scanner.stop();

    }

  } catch (_) {}

  try {

    await scanner.clear();

  } catch (_) {}

  scanner =
    null;

  document
    .getElementById(
      "reader"
    )
    .innerHTML =
      "";

  document
    .getElementById(
      "startScannerButton"
    )
    .disabled =
      false;

}


function esc(value) {

  return String(
    value == null
      ? ""
      : value
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}
