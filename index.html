<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A1-ISMB JSONP Test</title>
  <style>
    body { font-family: Arial,sans-serif; max-width:520px; margin:auto; padding:24px; }
    button { width:100%; padding:16px; font-size:17px; font-weight:bold; cursor:pointer; }
    #result { margin-top:20px; padding:15px; border:1px solid #ddd; border-radius:8px;
              white-space:pre-wrap; overflow-wrap:anywhere; min-height:80px; }
  </style>
</head>
<body>

<h2>A1-ISMB JSONP Connection Test</h2>
<button onclick="testJSONP()">TEST JSONP</button>
<div id="result">Press TEST JSONP.</div>

<script>
const backendUrl =
  "https://script.google.com/macros/s/AKfycbyagVLGrAMPyT9gZGptDhbM4WrzeW48WBTaM_SLe0e7o4d1QGUMW4XePuknS4DqbmFm/exec";

function testJSONP() {
  const result = document.getElementById("result");
  result.textContent = "Testing JSONP connection...";

  const callbackName = "a1ismbTestCallback";

  window[callbackName] = function(data) {
    result.textContent =
      "JSONP WORKING ✅\n\n" +
      JSON.stringify(data, null, 2);

    delete window[callbackName];
  };

  const script = document.createElement("script");

  script.src =
    backendUrl +
    "?action=retailActiveCarts" +
    "&callback=" + callbackName +
    "&_=" + Date.now();

  script.onerror = function() {
    result.textContent =
      "JSONP FAILED ❌\n\n" +
      "The browser could not load the Apps Script response as a script.";
    delete window[callbackName];
  };

  document.body.appendChild(script);
}
</script>

</body>
</html>
