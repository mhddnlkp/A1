<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A1-ISMB Fetch Test</title>
  <style>
    body { font-family: Arial, sans-serif; max-width:520px; margin:auto; padding:24px; }
    button { width:100%; padding:16px; font-size:17px; font-weight:bold; cursor:pointer; }
    #result { margin-top:20px; padding:15px; border:1px solid #ddd; border-radius:8px;
              white-space:pre-wrap; overflow-wrap:anywhere; min-height:80px; }
  </style>
</head>
<body>

<h2>A1-ISMB FETCH Connection Test</h2>
<button onclick="testBackend()">TEST FETCH</button>
<div id="result">Press TEST FETCH.</div>

<script>
const backendUrl =
  "https://script.google.com/macros/s/AKfycbyagVLGrAMPyT9gZGptDhbM4WrzeW48WBTaM_SLe0e7o4d1QGUMW4XePuknS4DqbmFm/exec";

async function testBackend() {
  const result = document.getElementById("result");
  result.textContent = "Connecting...";

  try {
    // Same simple fetch pattern used by the original working scanner demo.
    const response = await fetch(
      backendUrl + "?action=retailActiveCarts"
    );

    const data = await response.json();

    result.textContent =
      "FETCH WORKING ✅\n\n" +
      JSON.stringify(data, null, 2);

  } catch (error) {
    result.textContent =
      "FETCH FAILED ❌\n\n" +
      "Name: " + error.name + "\n" +
      "Message: " + error.message;
  }
}
</script>

</body>
</html>
